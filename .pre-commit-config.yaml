repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: ./.venv/bin/python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ./.venv/bin/python -m ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: ./.venv/bin/python -m ty check
        language: system
        types: [python]
        pass_filenames: false




