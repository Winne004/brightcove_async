  v2/accounts/{account_id}/jobs/{job_id}/start:
    put:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.StartJobResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/update
      summary: Start a given job
      description: |
        Initiate a previously configured live streaming job, beginning the encoding and distribution processes.
        
        **Starting a Job Overview:**
        This endpoint transitions a job from the "off" state to "starting", then to "on" once ready to accept input streams. The job will begin processing and distributing the stream according to its configuration.
        
        **How It Works:**
        1. Job state transitions: "off" → "starting" → "on"
        2. Ingest endpoints are generated and made available
        3. Encoding pipelines are initialized based on output configuration
        4. Manifest playlists become available for playback (after input is received)
        
        **Important Notes:**
        - Poll the Get Job endpoint to confirm `state.processing_state` is "on" and `state.ingest_state` has moved to "waiting" before connecting your encoder
        - Ingest endpoints are only available when the job is in the "on" state
        - The job will remain in "starting" state until encoding pipelines are ready
        
        **Response:**
        Returns the job ID and initiates the start process asynchronously. Use the Get Job endpoint or subscribe to notifications to track state transitions.
      tags:
        - jobs
  v2/accounts/{account_id}/jobs/{job_id}/stop:
    put:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.StopJobResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/update
      summary: Stop a job
      description: |
        Gracefully stop a running live streaming job, disconnecting from input sources and halting encoding and distribution processes.
        
        **Stopping a Job Overview:**
        This endpoint transitions a job from "on" to "stopping", then to "off" once all processes have been terminated. The job can be restarted later if needed.
        
        **How It Works:**
        1. Job state transitions: "on" → "stopping" → "off"
        2. Input connections are gracefully closed
        3. Encoding pipelines are shut down
        4. Manifest playlists stop updating (existing segments remain available for 14 days)
        5. If live_to_vod is enabled, final VOD asset is created
        
        **Important Notes:**
        - A job cannot be stopped while in a transition state (starting, stopping)
        - Stopped jobs can be restarted without losing configuration
        - If live_to_vod is enabled, the VOD asset is finalized when the job stops
        
        **Response:**
        Returns the job ID and initiates the stop process asynchronously. Use the Get Job endpoint or subscribe to notifications to confirm the job has reached the "off" state.
      tags:
        - jobs
