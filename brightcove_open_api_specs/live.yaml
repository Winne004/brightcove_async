            Unique identifier for the ad configuration. Generated automatically when creating a new 
            configuration. Required when updating an existing configuration.
          type: string
      required:
        - description
        - ad_server
      type: object
    ssai.AdServer:
      description: |
        Ad server settings that define how ads are requested and served. Includes the ad tag URL, 
        response format, and optional custom headers for authentication or targeting.
      properties:
        headers:
          description: |
            Custom HTTP headers to include with ad server requests. Some ad servers (such as VideoPlaza) 
            require custom headers for authentication or targeting. Standard headers like X-Forwarded-For 
            and X-Device-User-Agent are handled automatically by the system.
          additionalProperties:
            type: string
          type: object
        response_type:
          description: |
            Format of the ad server response. Must match the format your ad server returns.
            Valid values: "dfp" (Google DoubleClick for Publishers/SmartXML), "vast" (Video Ad Serving Template), "vmap" (Video Multiple Ad Playlist), or "playlist" (custom playlist format).
            Values are case-insensitive (e.g., "dfp", "DFP", "Dfp" are all accepted).
          $ref: '#/components/schemas/ssai.AdServerResponseType'
        url:
          description: |
            The ad tag URL from your ad server. This is the endpoint that will be called to request ads 
            during ad breaks. Must be a valid URL that returns ads in the specified response_type format.
          type: string
      required:
        - url
        - response_type
      type: object
    ssai.AdServerResponseType:
      description: |
        Format of the ad server response. Must match the format your ad server returns.
        Valid values: "dfp" (or "SmartXML" for Google DoubleClick for Publishers), "vast" (Video Ad Serving Template), "vmap" (Video Multiple Ad Playlist), or "playlist" (custom playlist format).
        Values are case-insensitive (e.g., "dfp", "DFP", "Dfp" are all accepted).
      enum:
        - dfp
        - vast
        - vmap
        - playlist
      type: string
      x-enum-varnames:
        - AdServerResponseTypeDFP
        - AdServerResponseTypeVAST
        - AdServerResponseTypeVMAP
        - AdServerResponseTypePlaylist
    ssai.CustomBeacon:
      properties:
        event:
          description: VAST-compliant event name for the beacon (e.g., "start", "complete", "firstQuartile", "midpoint", "thirdQuartile"). This determines when the beacon URL will be triggered during ad playback.
          type: string
        url:
          description: URL to call when the specified event occurs. This allows you to track ad playback events for analytics or reporting purposes.
          type: string
      type: object
    workflows.AutoStopTaskInfo:
      properties:
        state:
          type: string
        time_utc:
          description: UTC time to perform task. Should be a unix timestamp Seconds since epoch
          type: integer
      type: object
    workflows.Clip:
      properties:
        account_id:
          type: string
        clip:
          $ref: '#/components/schemas/workflows.ClipTaskInfo'
        description:
          type: string
        job_id:
          type: string
        metadata_passthrough:
          additionalProperties: {}
          type: object
        notification_url:
          type: string
        type:
          type: string
        workflow_id:
          type: string
        workflow_start_time_utc:
          type: integer
      type: object
    workflows.ClipOutput:
      properties:
        type:
          type: string
        url:
          type: string
      type: object
    workflows.ClipRequest:
      description: ClipRequest is the payload forwarded to jobs-api /clip at fire time.
      properties:
        custom_fields:
          additionalProperties:
            type: string
          type: object
        description:
          type: string
        end:
          type: string
        ingest_profile:
          type: string
        name:
          type: string
        output:
          $ref: '#/components/schemas/workflows.ClipOutput'
        override_reference_id:
          type: boolean
        reference_id:
          type: string
        remove_ads:
          type: boolean
        start:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        video_data:
          $ref: '#/components/schemas/workflows.ClipVideoData'
      type: object
    workflows.ClipTaskInfo:
      properties:
        clip_request:
          $ref: '#/components/schemas/workflows.ClipRequest'
        notification:
          description: |-
            Duration in seconds before TimeUTC to send a notification.
            Zero value means no notification should be sent.
          type: integer
        state:
          description: State of the clip task. Notification state is not represented here.
          type: string
        time_utc:
          description: UTC time to perform the clip. Unix timestamp in seconds.
          type: integer
      type: object
    workflows.ClipVideoData:
      properties:
        state:
          type: string
      type: object
    workflows.JobStartStopTaskInfo:
      description: Task information pertaining to Job Start/Stop
      properties:
        notification:
          description: |-
            Duration in seconds before TimeUTC to send a notification.
            Zero value means no notification should be sent
          type: integer
        state:
          description: State of the start/stop task. Notification state is not represented here
          type: string
        time_utc:
          description: UTC time to perform task. Should be a unix timestamp Seconds since epoch
          type: integer
      type: object
  securitySchemes:
    BC_OAuth2:
      flows:
        clientCredentials:
          scopes:
            video-cloud/livev2/jobs/all: "\t\tgrants job admin access"
            video-cloud/livev2/jobs/create: "\tgrants job create access"
            video-cloud/livev2/jobs/delete: "\tgrants job delete access"
            video-cloud/livev2/jobs/read: "\t\tgrants job read access"
            video-cloud/livev2/jobs/update: "\tgrants job change access"
            video-cloud/livev2/metrics/read: "\tgrants metric read access"
            video-cloud/livev2/settings/read: "\tgrants settings read access"
            video-cloud/livev2/ssai/read: "\t\tgrants SSAI ad config read access"
            video-cloud/livev2/ssai/create: "\tgrants SSAI ad config create access"
            video-cloud/livev2/ssai/update: "\tgrants SSAI ad config update access"
            video-cloud/livev2/ssai/delete: "\tgrants SSAI ad config delete access"
          tokenUrl: https://oauth.brightcove.com/v4/access_token
      in: Header
      type: oauth2
info:
  description: |-
    API for interacting with the Brightcove NextGen Live platform

    **Base URL**: https://api.live.brightcove.com
  title: Brightcove NextGen Live API
  x-bc-access: public
openapi: 3.0.0
paths:
  v2/accounts/{account_id}/jobs:
    get:
      parameters:
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
        - description: regions to query, comma separated values
          in: query
          name: regions
          schema:
            items:
              type: string
            type: array
        - description: modified_at filter - format <op>:<unixmillis>
          in: query
          name: modified_at
          schema:
            type: string
        - description: created_at filter - format <op>:<unixmillis>
          in: query
          name: created_at
          schema:
            type: string
        - description: |-
            Filter jobs by processing state. Supports comparison operators: eq (equals), ne (not equals), gt (greater than), lt (less than), gte (greater than or equal), lte (less than or equal). Format: '<operator>:<state>' where <state> is one of: on, off, starting, stopping, error, finishing, finished, configuring. Example: 'eq:on' or 'ne:error'.
          in: query
          name: processing_state
          schema:
            type: string
            example: 'eq:on'
        - description: filter by ingest state
          in: query
          name: ingest_state
          schema:
            type: string
        - description: filter by type
          in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.ListJobsResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/read
      summary: List all jobs in an account
      description: |
        Retrieve a comprehensive list of all live streaming jobs associated with your account, with optional filtering capabilities.
        
        **Listing Overview:**
        This endpoint provides a paginated list of all jobs (both channels and events) in your account, allowing you to monitor, filter, and manage your live streaming infrastructure at scale.
        
        **Filtering Capabilities:**
        - Filter by region(s) to see jobs in specific geographic locations
        - Filter by creation or modification timestamps using comparison operators
        - Filter by processing state (on, off, starting, stopping, error, etc.)
        - Filter by ingest state (connected, disconnected, waiting)
        - Filter by job type (channel or event)
        
        **Response Structure:**
        Returns an array of job summary objects containing essential information like ID, name, state, region, and type. Use the job ID to retrieve full details via the Get Job endpoint.
      tags:
        - jobs
    post:
      parameters:
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/endpoint.ConfigureJobRequest'
            example:
              name: "Live Stream with RTMP Output"
              description: "Example job configuration with RTMP streaming"
              type: "channel"
              region: "us-east-1"
              input:
                protocol: "rtmp"
              outputs:
                video:
                  - label: "1080p"
                    height: 1080
                    width: 1920
                    bitrate: 6000000
                    codec: "h264"
                    framerate: "30/1"
                    codec_options:
                      profile: "main"
                  - label: "720p"
                    height: 720
                    width: 1280
                    bitrate: 3000000
                    codec: "h264"
                    framerate: "30/1"
                    codec_options:
                      profile: "main"
                audio:
                  - label: "english"
                    codec: "aac"
                    bitrate: 128000
                    sample_rate: 48000
                  - label: "spanish"
                    codec: "aac"
                    bitrate: 128000
                    sample_rate: 48000
                rtmp:
                  - label: "primary_rtmp"
                    url: "rtmp://primary.example.com/live/stream_key_1"
                    video_label: "1080p"
                    audio_label: "english"
                  - label: "backup_rtmp"
                    url: "rtmps://backup.example.com/live/stream_key_2"
                    video_label: "720p"
                    audio_label: "spanish"
        description: Job Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Job'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/create
      summary: Configure a new job
      description: |
        Create a new live streaming job with comprehensive configuration options for input sources, output variants, manifest settings, and optional features like SSAI, DVR, and redundancy.
        
        **Input Restrictions:**
        - **Maximum input bitrate:** 50 Mbps (30 Mbps for input limit spikes)
        - **Maximum output bitrate:** 20 Mbps (25 Mbps in some configurations)
        - **Maximum resolution:** 4K (3840x2160) is supported
        - **Frame rate:** Recommended 30 fps, Maximum 60 fps. Higher frame rates require proportionally higher input bitrates
        - **Video codecs:** H.264 required
        - **Audio codec:** AAC required
        
        **Key Configuration Areas:**
        - **Input Protocol**: Supports RTMP, RTP, SRT, and SRT Caller protocols
        - **Output Variants**: Configure multiple video/audio renditions with different bitrates, resolutions, and codecs
        - **Manifest Options**: Set up HLS/DASH playlists with DVR, low-latency, and playlist group filtering
        - **RTMP Outputs**: Simulcast to external platforms (Facebook, YouTube, etc.)
        - **SSAI**: Enable server-side ad insertion with custom ad configurations
        - **Redundancy**: Configure in-region redundancy for high availability (requires num_inputs: 2)
        - **Live-to-VOD**: Automatically archive streams as Video Cloud assets
        
        **Response:**
        Returns the created job object with assigned job ID, ingest endpoints, and current state.
      tags:
        - jobs
  v2/accounts/{account_id}/jobs/{job_id}:
    delete:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Job ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.FinishJobResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/delete
      summary: Finish a job
      description: |
        Permanently archive a live streaming job. This is an irreversible action that cannot be undone.
        
        **Finishing a Job Overview:**
        Unlike the Stop endpoint which halts the stream but preserves the job configuration, Finish permanently archives the job and all associated resources. This action is final and cannot be reversed.
        
        **How It Works:**
        1. If the job is running, it must be stopped first using the Stop endpoint
        2. Job is permanently deleted from the system
        3. All job configuration is removed
        4. Ingest endpoints become invalid
        5. If live_to_vod was enabled, the VOD asset remains in Video Cloud
        
        **Common Use Cases:**
        - Clean up completed event channels
        - Remove test or temporary jobs
        - Archive old channels that are no longer needed
        - Free up account resources
        
        **Response:**
        Returns the job ID confirming the deletion.
      tags:
        - jobs
    get:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Job'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/read
      summary: Get a job
      description: |
        Retrieve complete details and current state of a specific live streaming job.
        
        **Job Details Overview:**
        This endpoint returns the full configuration and runtime state of a live job, including ingest endpoints, output configurations, manifest settings, and current processing/ingest states.
        
        **Information Returned:**
        - Complete job configuration (input, outputs, manifest, SSAI, etc.)
        - Current job state (processing_state, ingest_state)
        - Ingest endpoint URLs for encoder configuration
        - Creation and last started timestamps
        
        **Common Use Cases:**
        - Retrieve ingest endpoints after starting a job
        - Monitor job state transitions (starting → on → stopping → off)
        - Verify job configuration before starting
        - Get job details for integration with external systems
        - Check if a job is ready to accept input streams
        
      tags:
        - jobs
    put:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/external.JobConfig'
            example:
              type: "channel"
              region: "us-east-1"
              input:
                protocol: "rtmp"
              outputs:
                video:
                  - label: "1080p"
                    height: 1080
                    width: 1920
                    bitrate: 6000000
                    codec: "h264"
                    framerate: "30/1"
                    codec_options:
                      profile: "main"
                audio:
                  - label: "english"
                    codec: "aac"
                    bitrate: 128000
                    sample_rate: 48000
                rtmp:
                  - label: "updated_rtmp"
                    url: "rtmp://updated.example.com/live/new_stream_key"
                    video_label: "1080p"
                    audio_label: "english"
        description: Job Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.UpdateJobResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/update
      summary: Update a given job
      description: |
        Modify the configuration of an existing live streaming job. Updates can only be performed when the job is in the "off" state.
        
        **Update Overview:**
        This endpoint allows you to modify job settings such as output variants, notifications, and other configurable attributes. Some fields (like region, type, and manifest configuration) are immutable and cannot be changed after creation.
        
        **What Can Be Updated:**
        - Output variants (video, audio, RTMP outputs)
        - Notification endpoints
        - Maintenance preferences
        - Input protocol settings
        - Live-to-VOD settings
        - Audio-only mode
        - IP whitelist (CIDR blocks for input restriction)

        **What Cannot Be Updated:**
        - Region (immutable - create new job if region change needed)
        - DRM settings (cannot disable DRM once enabled - must create new job without DRM)
        - Redundancy configuration (cannot add/remove redundancy after creation)
        - Manifest configuration (immutable after creation — includes playlist groups, segment options, DVR settings, and low latency settings)
        - Segment duration and container format (immutable after creation)
        - SSAI configuration (immutable after creation)
        - Input protocol (cannot be changed if fixed IP is enabled)
        - Video codec for existing outputs (cannot change codec, but can add new outputs)
        - Audio codec for existing outputs (cannot change codec, but can add new outputs)
        
        **Best Practices:**
        - Always retrieve the current job configuration first using GET
        - Include all required fields in the update request
        - Ensure the job is stopped (state: "off") before updating
        - Test configuration changes on a test job before applying to production
        
        **Response:**
        Returns the updated job object, allowing you to verify changes were applied correctly.
      tags:
        - jobs
  v2/accounts/{account_id}/jobs/{job_id}/clip:
    post:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/endpoint.ClipRequest'
        description: Clip Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.ClipResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/create
      summary: Clip a given job
      description: |
        Create a Video-on-Demand (VOD) clip from a live stream by specifying a time range.
        
        **Live Clipping Overview:**
        This endpoint allows you to extract a specific segment from a live stream and create a standalone VOD asset. The clip is created from content up to 14 days after the stream ends.
        
        **How It Works:**
        1. Specify the start and end times for the clip segment
        2. Set metadata like name, description, tags, and custom fields
        3. The system processes the clip asynchronously
        4. A new VOD asset is created in Video Cloud
        
        **Important Notes:**
        - The job must be running or have been running recently (within 14 days after the stream ends)
        - Start and end times must be within the available window
        
        **Response:**
        Returns the clip object.
      tags:
        - jobs
  v2/accounts/{account_id}/jobs/{job_id}/failover:
    put:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pipeline_name:
                  description: Pipeline name to fail over from
                  type: string
              required:
                - pipeline_name
        description: Pipeline failover request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.ForceFailoverResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/update
      summary: Force Failover to a different pipeline
      description: |
        Manually trigger a failover to a different encoding pipeline when using redundancy configurations.
        
        **Failover Overview:**
        When a job is configured with redundancy (num_inputs: 2), multiple encoding pipelines process the stream simultaneously. This endpoint allows you to manually switch from one pipeline to another, useful for testing or when you detect quality issues.
        
        **How It Works:**
        1. Specify the pipeline ID to fail over from
        2. The system switches to the backup/redundant pipeline
        3. Playback continues seamlessly without interruption
        4. The previously active pipeline becomes the backup
        
        **Important Notes:**
        - Only available for jobs with redundancy enabled (num_inputs: 2)
        - The job must be in the "on" state
        - Failover happens automatically if a pipeline fails - this is for manual control
        - Playback should continue without interruption during failover
      tags:
        - jobs
  v2/accounts/{account_id}/jobs/{job_id}/reset_origin:
    post:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.ResetOriginResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/update
      summary: Reset Origin Endpoint
      description: |
        Flushes the DVR and timeshift/startover buffer content for the specified job, effectively resetting both the DVR window and timeshift playback buffer.
        
        **Important:** After performing this operation:
        - All buffered DVR content will be permanently removed
        - All timeshift/startover buffer content will be permanently removed
        - Timeshift playback functionality will no longer work for previously recorded content
        - Live-to-VOD clipping features will be unavailable for the flushed content
        - Only new content streamed after the reset will be available for DVR, timeshift, and clipping
        
        This operation is useful when you need to clear the buffer for compliance or content refresh purposes.
      tags:
        - reset_origin
  v2/accounts/{account_id}/jobs/{job_id}/scheduler:
    get:
      parameters:
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
        - description: max number of schedules to return
          in: query
          name: page_size
          schema:
            type: integer
        - description: next_token from last API response to get next batch of schedules
          in: query
          name: start_token
          schema:
            type: string
        - description: filter by state
          in: query
          name: state
          schema:
            type: string
        - description: filter by start time
          in: query
          name: start
          schema:
            type: integer
        - description: filter by end time
          in: query
          name: end
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.JobStartStopCreateResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/read
      summary: List all schedules of a job
      description: |
        Retrieve all scheduled start/stop workflows configured for a live streaming job.
        
        **Schedule Listing Overview:**
