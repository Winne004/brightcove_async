      summary: Inserts Cuepoint into running stream
      description: |
        Insert a cue point (ad break trigger) into a live stream that has SSAI enabled, allowing dynamic ad insertion at specific moments.
        
        **Cue Point Overview:**
        Cue points signal the ad server to insert ads at specific times during live playback. This endpoint allows you to programmatically trigger ad breaks in real-time, providing precise control over ad placement.
        
        **How It Works:**
        1. Specify the duration for the ad break
        2. Optionally provide ad server data in various formats
        3. The cue point is inserted into the stream
        4. Viewers see ads during playback at the specified time
        
        **Important Notes:**
        - The job must have SSAI enabled
        - The job must be in the "on" state and receiving input
        - Cue points are inserted in real-time and affect current and future viewers
        - Ad server data format must match your ad configuration
        - Duration should align with your ad pod configuration
        - **Timing:** Ads will be inserted at the end of a segment. It can take 35-40 seconds for ads to appear in the player after inserting a cue point. The first ad break insertion may not show ads immediately because ads need to be transcoded before insertion.
        
        **Response:**
        Returns the updated job object confirming the cue point was inserted. The ad break will appear in the stream for viewers who join after the cue point.
      tags:
        - ssai
