      summary: Lists Ad Configs
      description: |
        Retrieve all Server-Side Ad Insertion (SSAI) ad configurations associated with your account.
        
        **Ad Configs Overview:**
        This endpoint returns a list of all ad configurations that can be used to insert ads into live streaming jobs. Each configuration includes ad server settings, custom beacons, and metadata.
        
        **How It Works:**
        - Returns all ad configurations for the account
        - Each config includes ad server URL, response type, headers, and custom beacons
        - Use the config ID when creating jobs with SSAI enabled
        
        **Response Structure:**
        Returns an array of ad configuration objects, each containing the configuration ID, description, ad server settings, and custom beacon URLs.
      tags:
        - ssai
    post:
      parameters:
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ssai.AdConfiguration'
        description: |
          Ad configuration object. Required fields:
          - **description**: Human-readable description of the ad configuration
          - **ad_server.url**: Ad tag URL from your ad server
          - **ad_server.response_type**: Response format (dfp, vast, or vmap - case-insensitive)
          
          Optional fields:
          - **ad_server.headers**: Custom HTTP headers for ad server authentication or targeting
          - **custom_beacons**: Array of tracking beacons with event names and URLs
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ssai.AdConfiguration'
          description: OK
        "404":
