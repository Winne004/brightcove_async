          description: |-
            Array of audio PID mappings for MPEG-TS inputs. Allows you to specify which audio streams to process by their Program ID (PID). Used for multiple audio track configurations.
            
            **Multiple Audio Tracks:**
            - Each entry defines an audio track with a name and PID
            - The `name` field must match the `input_selector_name` in your audio output variants
            - Ensure your encoder is configured with the appropriate audio PIDs matching these values
            - If using redundancy, make sure both encoders send the desired input to the same PIDs
            
            **Example:** `[{"name": "english", "pid": 475}, {"name": "french", "pid": 476}]` allows you to reference these tracks in audio outputs using `input_selector_name: "english"` or `input_selector_name: "french"`.
