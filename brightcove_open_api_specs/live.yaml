            - video-cloud/livev2/ssai/create
      summary: Creates an Ad Config
      description: |
        Create a new Server-Side Ad Insertion (SSAI) ad configuration that can be used to enable dynamic ad insertion in live streams.
        
        **Ad Config Creation Overview:**
        This endpoint creates a reusable ad configuration that defines how ads are fetched, inserted, and tracked in your live streams. Once created, the configuration can be referenced by multiple jobs.
        
        **How It Works:**
        1. Define ad server URL and response type (VAST, VMAP, SmartXML, Playlist)
        2. Configure custom headers for ad server authentication
        3. Set up custom beacons for ad event tracking
        4. System validates and stores the configuration
        5. Configuration ID is returned for use in job creation
        
        **Key Configuration Elements:**
        - **Ad Server**: URL and response type for your ad decisioning server
        - **Headers**: Custom HTTP headers for authentication or targeting
        - **Custom Beacons**: URLs to track ad playback events (start, complete, quartiles)
        - **Description**: Human-readable name for the configuration
        
        **Response:**
        Returns the created ad configuration with assigned ID. Use this ID in the `ad_config_id` field when creating jobs with SSAI enabled, or in playback token requests.
