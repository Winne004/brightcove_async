  v2/accounts/{account_id}/playback/{job_id}/token:
    post:
      parameters:
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/endpoint.CreateTokenRequest'
        description: Token Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.CreateTokenResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/create
      summary: Create a playback token for a job
      description: |
        Generate a playback token that allows selective modification of the viewer's playback experience for a live streaming job.
        
        **Playback Token Overview:**
        The playback token provides granular control over how viewers experience your live stream. By configuring various parameters, you can customize features such as ad insertion, DVR capabilities, CDN routing, and timeshift playback - all on a per-session basis without modifying the underlying job configuration.
        
        **Timeshift Playback:**
        This powerful feature enables viewers to watch previously broadcast content from your live streams. Timeshift playback supports:
        - Viewing any portion of a live stream from the last 14 days
        - Creating playback windows of up to 24 hours in duration
        - Seamless navigation within the specified time range using start_time and end_time parameters
        
        This is particularly useful for catching up on missed content, creating highlight reels, or providing on-demand access to recent live events.
        
        **Use Cases:**
        - Enable different ad configurations for different viewer segments
        - Provide DVR controls for premium subscribers
        - Route specific viewers through custom CDN configurations
        - Allow replay of recent broadcast segments through timeshift
        - Control latency settings based on viewer requirements
      tags:
        - playback
  v2/accounts/{account_id}/playback/{job_id}/sources/batch:
    post:
      parameters:
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
        - description: Job ID
          in: path
          name: job_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                $ref: '#/components/schemas/endpoint.BatchPlaybackRequest'
              type: object
            example:
              dvr:
                playback:
                  manifest_format: "hls"
                  dvr: true
              non-dvr:
                playback:
                  manifest_format: "hls"
        description: Batch Sources Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.BatchGenerateSourcesResponse'
              example:
                dvr:
                  - codecs: "mp4a,avc1"
                    ext_x_version: "6"
                    key_systems:
                      com.apple.fps.1_0:
                        certificate_url: "https://license.live.brightcove.com/cert/fp?token=<jwt>"
                        key_request_url: "https://license.live.brightcove.com/lic/fp?token=<jwt>"
                      com.widevine.alpha:
                        license_url: "https://license.live.brightcove.com/lic/wv?token=<jwt>"
                      com.microsoft.playready:
                        license_url: "https://license.live.brightcove.com/lic/pr?token=<jwt>"
                    src: "https://fastly.live.brightcove.com/<job_id>/<region>/<account_id>/<token>/playlist-hls.m3u8"
                    type: "application/x-mpegURL"
                    uploaded_at: ""
                non-dvr:
                  - codecs: "mp4a,avc1"
                    ext_x_version: "6"
                    key_systems:
                      com.apple.fps.1_0:
                        certificate_url: "https://license.live.brightcove.com/cert/fp?token=<jwt>"
                        key_request_url: "https://license.live.brightcove.com/lic/fp?token=<jwt>"
                      com.widevine.alpha:
                        license_url: "https://license.live.brightcove.com/lic/wv?token=<jwt>"
                      com.microsoft.playready:
                        license_url: "https://license.live.brightcove.com/lic/pr?token=<jwt>"
                    src: "https://fastly.live.brightcove.com/<job_id>/<region>/<account_id>/<token>/playlist-hls.m3u8"
                    type: "application/x-mpegURL"
                    uploaded_at: ""
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/read
      summary: Generate batch sources for a job
      description: |
        Generate multiple playback source configurations in a single request with different playback parameters.
        
        **Batch Playback Overview:**
        This endpoint allows you to create multiple playback configurations simultaneously, each with different parameters. This is particularly useful when you need to provide multiple viewing experiences (e.g., with DVR and without DVR, different ad configurations, or different CDN routes) in a single API call.
        
        **How It Works:**
        - The request body accepts a map/object where each key is an arbitrary label you define
        - Each label maps to a playback configuration with specific parameters (similar to the single token endpoint)
        - The response returns sources for each labeled configuration, using the same labels you provided
        - You can use any meaningful labels (e.g., "dvr", "non-dvr", "premium", "free-tier", "ads-enabled", etc.)
        
        **Common Use Cases:**
        - Generate both DVR-enabled and non-DVR playlists simultaneously
        - Create multiple playlists with different ad configurations for A/B testing
        - Provide different quality tiers or CDN routes for various viewer segments
        - Generate playlists with different manifest formats (HLS and DASH) in one call
        
        **Response Structure:**
        The response mirrors your request structure, returning an array of source objects for each label.

        **DRM Support:**
        For jobs with DRM encryption enabled, each source object includes a `key_systems` field containing the DRM configuration for all enabled systems. Depending on the encryption modes configured on the job, `key_systems` may include `com.apple.fps.1_0` (FairPlay), `com.widevine.alpha` (Widevine), and/or `com.microsoft.playready` (PlayReady). Each key system provides the necessary license URLs for the player to acquire decryption keys.
      tags:
        - playback
