        **Metrics Overview:**
        This endpoint provides comprehensive monitoring data for live streaming jobs, including encoding performance, input quality, output distribution, and system health metrics. Metrics are aggregated over specified time periods and can be filtered by time range.
        
        **How It Works:**
        1. Specify comma-separated metric names to query
        2. Define time period (granularity) and range (time window)
        3. Optionally specify exact start and end times
        4. System returns aggregated metric data points
        
