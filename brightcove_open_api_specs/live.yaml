    endpoint.ConfigureJobRequest:
      properties:
        audio_only:
          description: |-
            When true, creates an audio-only live stream without video encoding. Useful for radio broadcasts or podcast streaming.
            
            Audio-only mode can be toggled after channel creation.
          type: boolean
        custom_fields:
          description: Custom metadata fields to associate with the live job. Map of field names to string values. These fields will be applied to any VOD assets created from this job.
          additionalProperties:
            type: string
          type: object
        description:
          description: Short description of the live streaming job. Maximum 250 characters.
          type: string
        encryption:
          description: Encryption configuration for content protection. Supports AES-128 and CENC (Common Encryption) for DRM.
          $ref: '#/components/schemas/external.Encryption'
        input:
          description: Input source configuration specifying the protocol (RTMP, RTP, SRT, etc.) and connection settings.
          $ref: '#/components/schemas/external.Input'
        live_to_vod:
          description: |-
            Enable automatic creation of Video Cloud assets from the live stream. When true, the stream will be automatically archived as a VOD asset.
            
            **Important:**
            - When `live_to_vod` is set to true, a VOD asset (video clip) will be automatically generated after the live event is stopped.
            - The job will be automatically archived after the VOD asset creation is complete. **Do not manually archive the job**—archiving while clip creation is in progress will cause the clip to fail.
          type: boolean
        long_description:
          description: Extended description of the live streaming job. Maximum 5000 characters.
          type: string
        maintenance_preferences:
          description: Scheduled maintenance window preferences. Allows you to specify preferred days and times for system maintenance.
          $ref: '#/components/schemas/external.MaintenancePreferences'
        manifest:
          description: Manifest configuration for HLS and DASH playlists, including DVR settings, playlist groups, and segment options.
          $ref: '#/components/schemas/external.ManifestOptions'
        name:
          description: Name/title of the live streaming job. This will appear in the Video Cloud Media Module if live_to_vod is enabled.
          type: string
        notifications:
          description: Array of webhook URLs to receive job state change and error notifications. Supports state_change and error subscription types.
          items:
            $ref: '#/components/schemas/external.Notification'
          type: array
          uniqueItems: false
        outputs:
          description: Output configuration specifying video, audio, caption, and RTMP output variants with encoding settings.
          $ref: '#/components/schemas/external.OutputVariants'
        playback_rights_id:
          description: Playback rights ID for DRM-protected content. Associates the job with specific playback rights and restrictions.
          type: string
        redundancy:
          description: Redundancy configuration for high availability. Specifies the number of redundant input sources for automatic failover.
          $ref: '#/components/schemas/external.RedundancyOptions'
        reference_id:
          description: Reference ID for the job. Must be unique within the account. Used for tracking and integration with external systems.
          type: string
        region:
          description: AWS region where the live stream will be processed (e.g., "us-east-1", "eu-west-1"). Choose the region closest to your source or audience.
          type: string
        ssai:
          description: Server-Side Ad Insertion (SSAI) configuration. Enables dynamic ad insertion into the live stream.
          $ref: '#/components/schemas/external.SSAI'
        tags:
          description: Array of tags to categorize and organize the live job. Useful for filtering and searching jobs.
          items:
            type: string
          type: array
          uniqueItems: false
        type:
          description: Type of live job. "channel" for linear channels (24x7 persistent streams) and "event" for event channels (one-time events). Both types can be started, stopped, and reused multiple times, but have different billing models.
          enum:
            - channel
            - event
          type: string
      required:
        - input
        - outputs
        - region
        - type
      type: object
    endpoint.CreateAdConfigRequest:
