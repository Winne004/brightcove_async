    endpoint.InsertCuePointRequest:
      properties:
        account_id:
          description: The Brightcove account ID associated with the live job.
          type: string
        ad_server_data:
          description: |
            Array of integers representing SCTE-35 cue point data to be passed to the ad server. 
            This data is used by the ad server to determine which ads to serve during the ad break.
            The format and content depend on your ad server's requirements and the ad_server_data_format specified.
            Typically contains SCTE-35 splice information or custom ad targeting data.
          items:
            type: integer
          type: array
          uniqueItems: false
        ad_server_data_format:
          description: |
            Format specification for the ad_server_data array. This indicates how the ad server should interpret 
            the data provided in ad_server_data. Common formats include SCTE-35 binary encoding or custom formats 
            specific to your ad server implementation. Must match the format expected by your configured ad server.
          type: string
        duration_in_seconds:
          description: |
            Duration of the ad break in seconds. This determines how long the ad insertion will last during playback.
            Common durations include 30, 60, or 90 seconds. The duration should align with your ad pod configuration 
            and the available ad inventory from your ad server. Viewers will see ads for this duration before the 
            live stream resumes.
          type: integer
        job_id:
          description: |
            The ID of the live job (channel or event) where the cue point should be inserted. 
            The job must have SSAI enabled and be in the "on" state (actively receiving input) for cue point insertion to succeed.
          type: string
      type: object
