          type: boolean
        modes:
          description: |-
            Array of encryption modes to apply for DRM protection. Supported values: "fairplay" (Apple FairPlay), "playready" (Microsoft PlayReady), "widevine" (Google Widevine), "aes128" (AES-128 encryption), or "all" (combines fairplay + playready + widevine). At least one mode must be specified.
            
            **Important Limitations:**
            - Once DRM encryption is enabled on a job, it cannot be disabled. To remove DRM from a job, you must create a new job without DRM enabled.
