      summary: Generate a playback url for a job
      description: |
        Generate a playback URL for a live stream using a previously created playback token.
        
        **Playback URL Overview:**
        This endpoint converts a playback token into a direct playback URL that can be used in video players. The URL incorporates all the settings specified when the token was created (DVR, SSAI, timeshift, etc.).
        
        **How It Works:**
        1. Provide the job ID and playback token (created via Create Token endpoint)
        2. The system generates a playback URL with token parameters embedded
        3. The URL points to the appropriate manifest (HLS or DASH)
          
        **Important Notes:**
        - The job must be running and receiving input for playback to work
        - URL format depends on manifest type (HLS .m3u8 or DASH .mpd)
        - The token's settings (DVR, SSAI, etc.) are applied to the generated URL
        
        **Response:**
        Returns a JSON object with a single "url" field containing the playback URL. This URL can be used directly in Brightcove Player.
