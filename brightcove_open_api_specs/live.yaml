    endpoint.CreateTokenRequest:
      properties:
        ad_config_id:
          description: The identifier of the ad configuration you want to use. This parameter is relevant only when 'ssai' is set to true. Obtain this ID from your ad configuration settings.
          type: string
        byocdn_id:
          description: The ID of your Bring Your Own CDN (BYO CDN) to create playback for. Contact Technical Support to obtain this identifier after registering your BYO CDN.
          type: string
        cenc:
          description: Enable Common Encryption (CENC) for DRM-protected playback. When true, the playback token will support DRM-encrypted streams.
          type: boolean
        dvr:
          description: Enable DVR (Digital Video Recording) functionality on playback. When true, viewers can pause, rewind, and seek within the live stream buffer.
          type: boolean
          default: false
        start_time:
          description: |-
            [Timeshift Playback] The start time for timeshift playback. Enables viewing of past content from live streams within the last 14 days. Must be used with end_time to define a playback window of maximum 24 hours.
            
            **Time Format:** Supports both Unix epoch timestamps (seconds since epoch) and ISO 8601 format (e.g., "2024-03-15T10:00:00Z"). Examples: 1710504000 (epoch) or "2024-03-15T10:00:00Z" (ISO 8601).
            
            **Valid Cases:**
            - Start time must be within the last 14 days of the job
            - Start time must be before end_time
            - Duration between start_time and end_time must be ≤ 24 hours
            - If only start_time is provided, playback behaves like a live stream allowing scrubbing back to the defined start_time
          type: string
        end_time:
          description: |-
            [Timeshift Playback] The end time for timeshift playback. Defines the end of the timeshift window. Must be used with start_time to create a playback window of maximum 24 hours within the last 14 days.
            
            **Time Format:** Supports both Unix epoch timestamps (seconds since epoch) and ISO 8601 format (e.g., "2024-03-15T12:00:00Z"). Examples: 1710511200 (epoch) or "2024-03-15T12:00:00Z" (ISO 8601).
            
            **Note:** If both start_time and end_time are set in the future, playback will begin when start_time becomes current, transitioning from no playback → live event → VOD playback (available for 14 days).
          type: string
        low_latency:
          description: Enable low latency mode for playback. Only applicable for jobs configured with low latency support. When true, reduces the delay between live capture and viewer playback.
          type: boolean
          default: false
        manifest_format:
          description: The format of the playlist URL to generate. Choose between "hls" for HLS manifests (.m3u8) or "dash" for DASH manifests (.mpd).
          type: string
          enum: ["hls", "dash"]
          example: "hls"
        playlist_name:
          description: The specific playlist to use for playback. Must match either one of the 'playlist_groups.name' values or the 'manifest.name' that was configured when the job was created. This allows selection of specific quality or language variants.
          type: string
        ssai:
          description: Enable Server-Side Ad Insertion (SSAI) for the playback session. When true, ads will be dynamically inserted into the stream. Requires 'ad_config_id' to be specified.
          type: boolean
          default: false
      type: object
    endpoint.CreateTokenResponse:
      properties:
        token:
          type: string
      type: object
